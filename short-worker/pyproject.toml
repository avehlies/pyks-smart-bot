[project]
name = "yks-short-worker"
version = "0.1.0"
description = "Finds new YKS YouTube Shorts and posts them in Discord; a sidecar to the YKS Smart Bot"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
# Deliberately independent of the bot package: it only shares the database (`youtube_shorts`).
dependencies = [
    "asyncpg>=0.30",
    "httpx>=0.28",
    "pydantic-settings>=2.16",
]

[project.scripts]
yks-short-worker = "yks_short_worker.__main__:main"
yks-short-worker-health = "yks_short_worker.health:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yks_short_worker"]
