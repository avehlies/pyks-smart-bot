name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel an in-progress run when a newer commit arrives on the same branch / PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12" # keep in sync with the Dockerfile base image

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Install dependencies (bot and clip worker)
        run: uv sync --locked --all-packages
      - name: Ruff lint
        run: uv run ruff check --output-format=github .
      - name: Ruff format
        run: uv run ruff format --check .

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine # same as docker-compose.yml
        env:
          POSTGRES_USER: yks
          POSTGRES_PASSWORD: yks
          POSTGRES_DB: yks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yks -d yks_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://yks:yks@localhost:5432/yks_test
      TEST_DATABASE_URL: postgresql://yks:yks@localhost:5432/yks_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Install dependencies (bot and clip worker)
        run: uv sync --locked --all-packages
      - name: Apply migrations
        run: uv run alembic upgrade head
      - name: Check models match migrations
        # Fails if someone changed src/yks/db/models.py without generating a migration.
        run: uv run alembic check
      - name: Run tests
        run: uv run pytest -ra

  docker:
    name: Docker build (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: bot
            dockerfile: Dockerfile
            check: python -c "import yks.bot.client; import importlib.util as u; assert u.find_spec('yks_clip_worker') is None and u.find_spec('faster_whisper') is None"
          - image: clip-worker
            dockerfile: clip-worker/Dockerfile
            check: python -c "import yks_clip_worker.worker, faster_whisper; import importlib.util as u; assert u.find_spec('discord') is None and u.find_spec('yks') is None"
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: yks-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Check the image contains only its own application
        run: docker run --rm yks-${{ matrix.image }}:ci ${{ matrix.check }}
